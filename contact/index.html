/*# sourceURL=global-styles-inline-css */ </style> <style id="admin-bar-inline-css"> /* Hide CanvasJS credits for P404 charts specifically */
 #p404RedirectChart .canvasjs-chart-credit {

 }
 .p404-redirect-adminbar-weekly-title {

 }
 #wpadminbar #wp-admin-bar-p404_free_top_button .ab-icon:before {

 #wp-admin-bar-p404_free_top_button .ab-item {

 } 
 /* Ensure proper positioning and z-index for P404 dropdown */
 .p404-redirect-adminbar-dropdown-wrap {

 #wpadminbar #wp-admin-bar-p404_free_top_button_dropdown {

 #wpadminbar #wp-admin-bar-p404_free_top_button_dropdown .ab-item {

 } 
 .p404-redirect-dropdown-container {

 }

 #wpadminbar #wp-admin-bar-p404_free_top_button:hover .p404-redirect-dropdown-container {

 } 
 .p404-redirect-btn {

 .p404-redirect-btn:hover {

 /* Prevent conflicts with other admin bar dropdowns */
 #wpadminbar .ab-top-menu > li:hover > .ab-item,
 #wpadminbar .ab-top-menu > li.hover > .ab-item {
 z-index: auto;
 } 
 #wpadminbar #wp-admin-bar-p404_free_top_button:hover > .ab-item {
 z-index: 999998 !important;
 }

/* Start custom CSS *//* ======================================================
 CASE STUDY TOOLTIP + PORTFOLIO HOVER EFFECTS
====================================================== */
/* Tooltip container */
.case-study-card {
 position: relative;
 overflow: hidden;
}
/* Tooltip */
.case-study-card::after {
 content: "Read Case Study";
 position: absolute;
 top: 24px;
 right: 24px;
 background: #111111;
 color: #ffffff !important;
 padding: 12px 16px;
 font-size: 14px;
 font-weight: 500;
 letter-spacing: -0.02em;
 opacity: 0;
 transform: translateY(-8px);
 transition:
 opacity 0.25s ease,
 transform 0.25s ease;
 pointer-events: none;
 z-index: 999;
 border-radius: 4px;
}
/* Show tooltip */
.case-study-card:hover::after {
 opacity: 1;
 transform: translateY(0);
}  /* ======================================================
 PORTFOLIO CARD HOVER
====================================================== */
.portfolio-card,
.portfolio-card:visited,
.portfolio-card:hover,
.portfolio-card:active {
 cursor: pointer;
 color: #111111 !important;
 text-decoration: none !important;
}
/* Keep all text black */
.portfolio-card h1,
.portfolio-card h2,
.portfolio-card h3,
.portfolio-card h4,
.portfolio-card h5,
.portfolio-card h6,
.portfolio-card p,
.portfolio-card span {
 color: #111111 !important;
}
/* Smooth image hover */
.portfolio-card .elementor-widget-image img {
 transition: transform 0.45s ease;
}
/* Prevent image overflow */
.portfolio-card .project-square,
.portfolio-card .project-portrait,
.portfolio-card .project-wide {
 overflow: hidden;
}
/* Subtle image zoom */
.portfolio-card:hover .elementor-widget-image img {
 transform: scale(1.015);
}
/* Underline title on hover */
.portfolio-card:hover .elementor-heading-title {
 text-decoration: underline !important;
 text-underline-offset: 4px;
}
/* Subaru custom tooltip */
.subaru-card::after {
